<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#4A0012" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>
  <!-- Background with gold border -->
  <rect width="512" height="512" rx="112" fill="url(#maroonGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />
  
  <!-- Sacred Kalash with Coconut and Mango Leaves -->
  <g transform="translate(256, 270) scale(1.35)">
    <!-- Mango leaves -->
    <path d="M-50 -30 C-70 -70 -30 -110 0 -130 C-10 -90 -20 -60 -20 -30 Z" fill="#166534" />
    <path d="M50 -30 C70 -70 30 -110 0 -130 C10 -90 20 -60 20 -30 Z" fill="#166534" />
    <path d="M-25 -30 C-40 -80 0 -120 0 -140 C-5 -100 -10 -70 -10 -30 Z" fill="#15803D" />
    <path d="M25 -30 C40 -80 0 -120 0 -140 C5 -100 10 -70 10 -30 Z" fill="#15803D" />
    <!-- Coconut / Nariyal -->
    <ellipse cx="0" cy="-60" rx="34" ry="42" fill="#78350F" />
    <circle cx="0" cy="-70" r="12" fill="#92400E" />
    <!-- Kalash Vessel -->
    <!-- Rim -->
    <ellipse cx="0" cy="-25" rx="46" ry="10" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="3" />
    <!-- Neck -->
    <path d="M-36 -24 L-28 -5 Q-55 40 -40 75 Q-20 100 0 100 Q20 100 40 75 Q55 40 28 -5 L36 -24 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="4" />
    <!-- Swastika / Auspicious Emblem on pot -->
    <g stroke="#800020" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M0,20 L0,56 M-18,38 L18,38" />
      <path d="M0,20 L16,20" />
      <path d="M18,38 L18,54" />
      <path d="M0,56 L-16,56" />
      <path d="M-18,38 L-18,22" />
      <circle cx="-9" cy="29" r="1.5" fill="#800020" />
      <circle cx="9" cy="29" r="1.5" fill="#800020" />
      <circle cx="-9" cy="47" r="1.5" fill="#800020" />
      <circle cx="9" cy="47" r="1.5" fill="#800020" />
    </g>
    <!-- Base -->
    <ellipse cx="0" cy="100" rx="28" ry="8" fill="url(#goldGrad)" />
  </g>
  <!-- Diya base flame in foreground accent -->
  <g transform="translate(256, 435) scale(0.9)">
    <path d="M-50,0 Q0,25 50,0 Q25,-8 0,-8 Q-25,-8 -50,0 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2" />
    <!-- Flame -->
    <path d="M0,-8 C-12,-25 0,-48 0,-58 C0,-48 12,-25 0,-8 Z" fill="url(#flameGrad)" />
  </g>
</svg>
