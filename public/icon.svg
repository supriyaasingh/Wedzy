<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Burgundy Velvet Background Gradient -->
    <radialGradient id="burgundyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#6B0A1C" />
      <stop offset="50%" stop-color="#4A0512" />
      <stop offset="100%" stop-color="#2D0209" />
    </radialGradient>

    <!-- Antique Royal Gold Shimmer Gradient -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5B94E" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="75%" stop-color="#C68A1E" />
      <stop offset="100%" stop-color="#8C5806" />
    </linearGradient>

    <!-- Deep Gold Shadow for Dimension -->
    <filter id="goldDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Subtle Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.45" />
    </radialGradient>
  </defs>

  <!-- Base Burgundy Rounded Icon -->
  <rect width="512" height="512" rx="112" fill="url(#burgundyBg)" />
  <rect width="512" height="512" rx="112" fill="url(#innerGlow)" />

  <!-- Outer Double Gold Royal Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#antiqueGold)" stroke-width="6" opacity="0.85" />
  <rect x="32" y="32" width="448" height="448" rx="84" fill="none" stroke="url(#antiqueGold)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- 4 Corner Auspicious Floral Accents -->
  <g fill="url(#antiqueGold)">
    <circle cx="56" cy="56" r="5" />
    <circle cx="456" cy="56" r="5" />
    <circle cx="56" cy="456" r="5" />
    <circle cx="456" cy="456" r="5" />
  </g>

  <!-- Central WG Monogram Group -->
  <g filter="url(#goldDropShadow)">
    
    <!-- Heart Motif above W apex -->
    <path d="M 256,128 C 248,114 230,110 220,122 C 206,138 220,154 256,182 C 292,154 306,138 292,122 C 282,110 264,114 256,128 Z"
          fill="none" stroke="url(#antiqueGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- "W" Letterform (Classical Royal Calligraphy Serif) -->
    <!-- Left diagonal stem with top serif -->
    <path d="M 130,175 L 178,175 M 154,175 L 202,345 L 230,345 L 256,220 L 282,345 L 310,345 L 358,175 M 336,175 L 380,175"
          fill="none" stroke="url(#antiqueGold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Solid decorative serif caps and calligraphic stroke weight -->
    <path d="M 145,175 L 185,175 L 222,335 L 198,335 Z" fill="url(#antiqueGold)" />
    <path d="M 248,228 L 264,228 L 298,335 L 278,335 Z" fill="url(#antiqueGold)" />

    <!-- "G" Letterform (Interlaced Royal Curved Capital) -->
    <path d="M 368,235 C 342,205 295,200 252,225 C 200,255 190,325 235,372 C 275,412 342,408 375,372 C 388,358 394,340 395,315 L 318,315"
          fill="none" stroke="url(#antiqueGold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- G Spur / Crossbar flourish -->
    <path d="M 320,305 L 400,305 L 400,332 L 320,332 Z" fill="url(#antiqueGold)" />

    <!-- 4-Point Star Sparkle to right of G -->
    <path d="M 425,270 Q 425,285 410,285 Q 425,285 425,300 Q 425,285 440,285 Q 425,285 425,270 Z"
          fill="url(#antiqueGold)" />
    <circle cx="425" cy="285" r="2.5" fill="#FFF2A3" />

    <!-- Bottom Auspicious Floral Flourish -->
    <path d="M 210,418 Q 256,432 302,418 Q 280,410 256,422 Q 232,410 210,418 Z" fill="url(#antiqueGold)" opacity="0.9" />
    <circle cx="256" cy="428" r="4" fill="url(#antiqueGold)" />
    <circle cx="236" cy="425" r="2.5" fill="url(#antiqueGold)" />
    <circle cx="276" cy="425" r="2.5" fill="url(#antiqueGold)" />

  </g>
</svg>
